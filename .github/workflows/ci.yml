name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # @bildr/nuxt serves the built editor (packages/editor/dist); its typecheck runs in `pnpm run typecheck` (packages/**).
      - name: Build the editor
        run: pnpm run build:editor

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # The golden generated app is a standalone pnpm project (not in the workspace). The
      # migration tests use its drizzle-kit install, and in CI they fail rather than skip without it.
      - name: Install the golden fixture
        run: pnpm --dir fixtures/codegen/blog install --frozen-lockfile

      - name: Test
        run: pnpm run test

      - name: Fixture typecheck
        run: pnpm --dir fixtures/codegen/blog run typecheck

      - name: Fixture lint
        run: pnpm --dir fixtures/codegen/blog run lint

      - name: Fixture test
        run: pnpm --dir fixtures/codegen/blog run test

      - name: Fixture build
        run: pnpm --dir fixtures/codegen/blog run build

  # T11: create a project, model it through the editor on nuxt dev, install it for real,
  # build it without bildr, boot it and smoke list/detail/create in a browser.
  e2e-generated:
    # Playwright 1.60 can't install Chromium on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the editor
        run: pnpm run build:editor

      # The browser driver stays out of the workspace: the same playwright-core the local runs use.
      - name: Install playwright-core and Chromium
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright-core@1.60.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright-core" install --with-deps chromium
          echo "PLAYWRIGHT_CORE=$RUNNER_TEMP/pw/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          echo "CHROMIUM=$(node --input-type=module -e "const { chromium } = await import('$RUNNER_TEMP/pw/node_modules/playwright-core/index.mjs'); console.log(chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: End-to-end (generated app)
        run: pnpm run e2e:generated --install
        env:
          E2E_TMP: ${{ runner.temp }}
