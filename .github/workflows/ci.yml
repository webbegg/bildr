name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # The golden generated app is a standalone pnpm project (not in the workspace). The
      # migration tests use its drizzle-kit install, and in CI they fail rather than skip without it.
      - name: Install the golden fixture
        run: pnpm --dir fixtures/codegen/blog install --frozen-lockfile

      - name: Test
        run: pnpm run test

      - name: Fixture typecheck
        run: pnpm --dir fixtures/codegen/blog run typecheck

      - name: Fixture lint
        run: pnpm --dir fixtures/codegen/blog run lint

      - name: Fixture test
        run: pnpm --dir fixtures/codegen/blog run test

      - name: Fixture build
        run: pnpm --dir fixtures/codegen/blog run build
